[package]
name = "litemark"
version = "0.13.0"
edition = "2021"
authors = ["LiteMark Contributors"]
description = "Native Markdown and text editor"
license = "MIT"

[features]
# Opt-in: benchmark RSS before making this the default.
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
gpui = { version = "=0.2.2" }
rust-embed = "8.5"
rfd = "0.15"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2"
dirs = "5.0"
lopdf = { version = "0.47", default-features = false }
unicode-segmentation = "1.12"
trash = "5"
# Same version gpui uses; only reads image headers for their size.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ureq = "2"
futures = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
# xattr 0.2.3 (pulled in by gpui's tar support) uses libc::ENOATTR, which libc
# doesn't define on Linux. The patch uses ENODATA there and keeps ENOATTR on
# macOS and the BSDs (patches/xattr/src/sys/mod.rs).
xattr = { path = "patches/xattr" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
