[package]
name = "litemark"
version = "0.15.0"
edition = "2021"
authors = ["LiteMark Contributors"]
description = "Native Markdown and text editor"
license = "MIT"

[features]
# Opt-in: benchmark RSS before making this the default.
mimalloc = ["dep:mimalloc"]
# Test-only: count live heap bytes for `memory_bench_tests` (one atomic per call).
heap-count = []

[dependencies]
mimalloc = { version = "0.1", optional = true }
gpui = { version = "=0.2.2" }
rust-embed = { version = "8.5", features = ["include-exclude"] }
rfd = "0.15"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2"
dirs = "5.0"
lopdf = { version = "0.47", default-features = false }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
fontdb = "0.23"
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-segmentation = "1.12"
trash = "5"
# Same version gpui uses; only reads image headers for their size.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ureq = { version = "2", default-features = false, features = ["gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
futures = { version = "0.3", default-features = false, features = ["std"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
# xattr 0.2.3 (pulled in by gpui's tar support) uses libc::ENOATTR, which libc
# doesn't define on Linux. The patch uses ENODATA there and keeps ENOATTR on
# macOS and the BSDs (patches/xattr/src/sys/mod.rs).
xattr = { path = "patches/xattr" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Size-optimize dependencies (about 8% smaller binary, no measurable frame-time
# change) but keep full optimization for the app crate (a workspace member, so
# "*" skips it) and the hot parse/text paths. See docs/m6-perf-plan.md, E3.
[profile.release.package."*"]
opt-level = "z"

[profile.release.package.gpui]
opt-level = 3

[profile.release.package.pulldown-cmark]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.unicode-segmentation]
opt-level = 3
