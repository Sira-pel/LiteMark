[package]
name = "litemark"
version = "0.9.0"
edition = "2021"
authors = ["LiteMark Contributors"]
description = "Native Markdown and text editor"
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2" }
rust-embed = "8.5"
rfd = "0.15"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = "0.4"
lopdf = "0.34"
unicode-segmentation = "1.12"
trash = "5"
ureq = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
xattr = { path = "patches/xattr" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
