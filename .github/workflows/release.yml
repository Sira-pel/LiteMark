name: Release

on:
  push:
    tags: ["v*"]

# Build jobs run `cargo test` and `cargo build`, which execute the build
# scripts of every dependency, so they only get a read-only token. Only the
# publish job, which runs no project code, may write to the release.
permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            dpkg-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libfreetype6-dev

      # Fixed compiler version, so a release build is reproducible.
      - uses: dtolnay/rust-toolchain@fa51344246423bb1896f389ae2a83b9784ddb363 # 1.97.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test

      - name: Build the .deb
        run: bash scripts/build-deb.sh

      - name: Write checksum
        run: |
          cd build
          sha256sum litemark_*_amd64.deb > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: |
            build/litemark_*_amd64.deb
            build/SHA256SUMS
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa51344246423bb1896f389ae2a83b9784ddb363 # 1.97.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Test
        run: cargo test

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            build/LiteMark-*-windows-x64-setup.exe
            build/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa51344246423bb1896f389ae2a83b9784ddb363 # 1.97.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test

      - name: Build the .dmg
        run: bash scripts/build-macos.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.os }}
          path: |
            build/LiteMark-*-macos-*.dmg
            build/SHA256SUMS-macos-*.txt
          if-no-files-found: error

  # Runs only after every platform built and passed its tests, so a release
  # is never published with some installers missing. No checkout and no
  # project code: it only uploads the files the build jobs produced.
  publish:
    needs: [deb, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # Fixed-name copies so the README can link to releases/latest/download/.
          cp litemark_*_amd64.deb litemark_amd64.deb
          cp LiteMark-*-windows-x64-setup.exe LiteMark-windows-x64-setup.exe
          for f in LiteMark-*-macos-*.dmg; do
            cp "$f" "LiteMark-macos-${f##*-macos-}"
          done
          ls -l
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LiteMark ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            ./*
