<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#77216F"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F1EF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Ubuntu Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Editor Paper Sheet -->
  <g filter="url(#shadow)">
    <rect x="110" y="96" width="292" height="320" rx="16" fill="url(#paperGrad)"/>
    <!-- Folded top corner accent -->
    <path d="M352 96 L402 146 L352 146 Z" fill="#D6D3CD"/>
    
    <!-- Notepad Lines -->
    <rect x="150" y="160" width="160" height="14" rx="7" fill="#E95420"/>
    <rect x="150" y="200" width="212" height="10" rx="5" fill="#AEA79F"/>
    <rect x="150" y="232" width="190" height="10" rx="5" fill="#AEA79F"/>
    <rect x="150" y="264" width="204" height="10" rx="5" fill="#AEA79F"/>
    <rect x="150" y="296" width="140" height="10" rx="5" fill="#AEA79F"/>

    <!-- Subtle pencil / cursor mark -->
    <rect x="150" y="340" width="24" height="12" rx="3" fill="#77216F"/>
    <rect x="180" y="343" width="70" height="6" rx="3" fill="#5E2750"/>
  </g>
</svg>
